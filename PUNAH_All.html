<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌞 PUNAH Exercise Database v4.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--surface2:#FBFAF6;--surface3:#F3F1EA;
  --border:#ECE8DE;--border2:#DDD9CF;
  --text:#22231F;--muted:#5C5E55;--faint:#8A8C82;
  --teal:#1F6B4A;--orange:#C2700C;--purple:#1F6B4A;--blue:#1F6B4A;
  --green:#1F6B4A;--amber:#C2700C;--red:#C0492F;--pink:#1F6B4A;
  --safe-bg:#E7F1EC;--safe-fg:#1F6B4A;
  --mon-bg:#FAEFDD;--mon-fg:#C2700C;
  --avo-bg:#F7E6E0;--avo-fg:#C8806E;
  --beg-bg:#22231F;--beg-fg:#1F6B4A;
  --int-bg:#FAEFDD;--int-fg:#C2700C;
  --adv-bg:#F7E6E0;--adv-fg:#C8806E;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;min-height:100vh}
/* ── HEADER ── */
.hdr{background:linear-gradient(135deg,#FBFAF6 0%,#F3F1EA 100%);border-bottom:1px solid var(--border);padding:16px 20px;position:sticky;top:0;z-index:100}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hdr-title{font-size:clamp(14px,2.5vw,22px);font-weight:700;font-family:'Fraunces',serif;background:linear-gradient(90deg,#22231F,#5C5E55);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-sub{font-size:10px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-top:2px}
.count-badge{background:var(--surface3);border:1px solid var(--border2);border-radius:20px;padding:4px 14px;font-size:11px;color:var(--text);white-space:nowrap}
.count-badge span{font-weight:700;color:var(--teal)}
/* ── SEARCH ── */
.search-bar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.search-input{flex:1;min-width:200px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-size:13px;padding:8px 14px;outline:none;transition:border .2s}
.search-input:focus{border-color:var(--teal)}
.clear-btn{background:var(--surface3);border:1px solid var(--border2);border-radius:8px;color:var(--muted);cursor:pointer;font-size:11px;padding:8px 14px;white-space:nowrap;transition:all .2s}
.clear-btn:hover{color:var(--text);border-color:var(--red)}
/* ── ACTIVE FILTER TAGS ── */
.active-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;min-height:22px}
.tag{background:var(--teal)22;border:1px solid var(--teal)44;border-radius:20px;color:var(--teal);cursor:pointer;font-size:10px;padding:2px 10px;display:flex;align-items:center;gap:5px}
.tag:hover{background:var(--red)22;border-color:var(--red);color:var(--red)}
/* ── LAYOUT ── */
.layout{display:flex;gap:0;height:calc(100vh - 210px)}
/* ── FILTERS PANEL ── */
.filters{width:260px;min-width:220px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0}
.filter-group{border-bottom:1px solid var(--border)}
.fg-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:10px 14px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;user-select:none;transition:background .15s}
.fg-header:hover{background:var(--surface2)}
.fg-header .arrow{font-size:9px;transition:transform .2s}
.fg-header.open .arrow{transform:rotate(180deg)}
.fg-body{display:none;padding:4px 8px 8px}
.fg-body.open{display:block}
.fg-search{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:11px;padding:5px 9px;outline:none;margin-bottom:6px}
.cb-row{display:flex;align-items:center;gap:7px;padding:3px 6px;border-radius:5px;cursor:pointer;font-size:11px;color:var(--muted);transition:all .15s;position:relative}
.cb-row:hover{background:var(--surface2);color:var(--text)}
.cb-row input[type=checkbox]{accent-color:var(--teal);width:13px;height:13px;cursor:pointer;flex-shrink:0}
.cb-row.checked{color:var(--text)}
.cb-count{margin-left:auto;font-size:9px;color:var(--faint);background:var(--surface3);border-radius:10px;padding:1px 6px}
.sel-all{font-size:10px;color:var(--teal);cursor:pointer;padding:2px 6px;margin-bottom:4px;display:block;text-align:right}
.sel-all:hover{text-decoration:underline}
/* ── SORT CONTROLS ── */
.sort-bar{background:var(--surface2);border-bottom:1px solid var(--border);padding:6px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px}
.sort-label{color:var(--muted)}
.sort-btn{background:var(--surface3);border:1px solid var(--border2);border-radius:6px;color:var(--muted);cursor:pointer;font-size:10px;padding:3px 10px;transition:all .15s;display:flex;align-items:center;gap:4px}
.sort-btn:hover{color:var(--text);border-color:var(--blue)}
.sort-btn.active{background:var(--blue)22;border-color:var(--blue);color:var(--blue)}
/* ── TABLE AREA ── */
.table-wrap{flex:1;overflow:auto;position:relative}
table{width:100%;border-collapse:collapse;min-width:1100px}
thead th{background:var(--surface2);border-bottom:2px solid var(--border2);color:var(--muted);cursor:pointer;font-size:10px;font-weight:600;letter-spacing:.08em;padding:9px 10px;position:sticky;top:0;text-align:left;text-transform:uppercase;user-select:none;white-space:nowrap;z-index:10;transition:color .15s}
thead th:hover{color:var(--text)}
thead th.sorted{color:var(--teal)}
thead th .sort-icon{font-size:8px;margin-left:3px;opacity:.5}
thead th.sorted .sort-icon{opacity:1}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--surface2)}
tbody tr.expanded{background:var(--surface2)}
tbody td{padding:8px 10px;vertical-align:top;font-size:11px;color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tbody tr.expanded td{white-space:normal;max-width:none}
tbody td.bold{color:var(--text);font-weight:500}
tbody td.var{color:#5C5E55}
/* ── PILL BADGES ── */
.pill{border-radius:4px;display:inline-block;font-size:9px;font-weight:600;letter-spacing:.05em;padding:2px 7px;white-space:nowrap}
.pill-safe{background:var(--safe-bg);color:var(--safe-fg);border:1px solid #1F6B4A33}
.pill-monitor{background:var(--mon-bg);color:var(--mon-fg);border:1px solid #C2700C33}
.pill-avoid{background:var(--avo-bg);color:var(--avo-fg);border:1px solid #C0492F33}
.pill-beg{background:var(--beg-bg);color:var(--beg-fg);border:1px solid #1F6B4A33}
.pill-int{background:var(--int-bg);color:var(--int-fg);border:1px solid #B8620833}
.pill-adv{background:var(--adv-bg);color:var(--adv-fg);border:1px solid #8A2B2B33}
.pill-type{background:#E7F1EC;border:1px solid #1F6B4A33;color:#1F6B4A}
.yt-link{background:#F7E6E0;border:1px solid #F2C9C9;border-radius:4px;color:#B23838;font-size:9px;font-weight:700;padding:2px 7px;text-decoration:none;white-space:nowrap}
.yt-link:hover{background:#8A2B2B44;color:#C8806E}
/* ── EXPAND ROW ── */
.expand-row td{background:var(--surface3) !important;padding:12px 16px;font-size:11px;border-top:1px solid var(--border2);white-space:normal;max-width:none;overflow:visible}
.expand-row .expand-grid{position:sticky;left:0;width:calc(100vw - 32px)}
.expand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.expand-item label{font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;display:block;margin-bottom:3px}
.expand-item p{color:var(--text);font-size:11px;line-height:1.5}
/* ── EMPTY STATE ── */
.empty{align-items:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;justify-content:center;padding:80px;text-align:center;width:100%}
/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--faint);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.pa-back{display:inline-flex;align-items:center;gap:5px;font-size:.9rem;color:var(--muted);text-decoration:none;margin-bottom:8px}
.pa-back span{font-family:'Fraunces',serif;font-weight:600;color:var(--ink)}
.pa-back span b{color:#1F6B4A;font-weight:600}
.pa-back:active{opacity:.55}
.filt-toggle{display:none;align-items:center;gap:6px;background:#1F6B4A;color:#fff;border:none;border-radius:999px;
  padding:7px 15px;font-weight:600;font-size:.85rem;cursor:pointer;margin-right:6px}
.filt-overlay{display:none}
@media(max-width:768px){
  .layout{height:auto}
  .filters{display:block;position:fixed;top:0;left:0;bottom:0;height:100vh!important;width:84%;max-width:330px;z-index:60;
    transform:translateX(-100%);transition:transform .28s ease;box-shadow:0 0 40px rgba(34,35,31,.20)}
  .filters.open{transform:translateX(0)}
  .filt-overlay{display:block;position:fixed;inset:0;background:rgba(34,35,31,.42);z-index:55;opacity:0;visibility:hidden;transition:opacity .28s}
  .filt-overlay.open{opacity:1;visibility:visible}
  .filt-toggle{display:inline-flex}
}

/* ── QUICK FILTER TABS ── */
.qf-section{background:#FBFAF6;border-bottom:1px solid #ECE8DE;padding:8px 16px 6px;}
.qf-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px;}
.qf-row:last-child{margin-bottom:0;}
.qf-label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8A8C82;flex-shrink:0;min-width:68px;}
.qf-pills{display:flex;gap:4px;flex-wrap:wrap;overflow-x:auto;scrollbar-width:none;}
.qf-pills::-webkit-scrollbar{display:none;}
.qf-pill{border:1.5px solid #ECE8DE;border-radius:20px;background:#fff;color:#5C5E55;cursor:pointer;font-size:10px;font-weight:700;padding:3px 11px;white-space:nowrap;transition:all .15s;line-height:1.6;}
.qf-pill:hover{border-color:#8A8C82;color:#22231F;}
.qf-pill.active{color:#fff;border-color:transparent;}
.qf-pill.active.cat{background:#1F6B4A;}
.qf-pill.active.diff{background:#C2700C;}
.qf-pill.active.muscle{background:#1F6B4A;}
.qf-pill.active.safety-pill{background:#1F6B4A;}
.qf-pill.active.all{background:#5C5E55;}
.qf-collapse-btn{font-size:9px;font-weight:700;color:#8A8C82;cursor:pointer;margin-left:auto;white-space:nowrap;padding:2px 6px;border-radius:4px;border:1px solid #ECE8DE;background:#fff;}
.qf-collapse-btn:hover{color:#22231F;border-color:#8A8C82;}
.qf-extra{display:none;}
.qf-extra.open{display:flex;}

/* ═══════════════ LIGHT THEME OVERRIDE ═══════════════ */
:root{
  --bg:#FFFFFF;--sf:#FBFAF6;--sf2:#F3F1EA;--sf3:#F3F1EA;
  --bd:#ECE8DE;--bd2:#DDD9CF;
  --tx:#22231F;--mt:#5C5E55;--ft:#8A8C82;
  --tl:#1F6B4A;--or:#C2700C;--pu:#1F6B4A;--rd:#C0492F;
  --gn:#1F6B4A;--am:#C2700C;
  --p1:#1F6B4A;--p2:#C2700C;--p3:#1F6B4A;
  --b1:#E7F1EC;--b2:#FAEFDD;--b3:#E7F1EC;
}
body{background:#fff;color:#22231F}
/* headers */
.hdr{background:linear-gradient(135deg,#FBFAF6 0%,#F3F1EA 100%)!important;border-bottom:1px solid #ECE8DE!important}
.hdr-title,.hdr-title *{background:linear-gradient(90deg,#22231F,#5C5E55)!important;-webkit-background-clip:text!important;-webkit-text-fill-color:transparent!important}
.hdr-sub,.hdr-sub *{color:#5C5E55!important}
.tabs,.tab-bar{background:#FBFAF6!important;border-bottom:1px solid #ECE8DE!important}
.tab{color:#5C5E55!important}
.tab:hover{color:#22231F!important}
.tab.act,.tab.active{color:#22231F!important}
.tab.t1.act,.tab.ph1.active{color:#1F6B4A!important;border-bottom-color:#1F6B4A!important}
.tab.t2.act,.tab.ph2.active{color:#C2700C!important;border-bottom-color:#C2700C!important}
.tab.t3.act,.tab.ph3.active{color:#1F6B4A!important;border-bottom-color:#1F6B4A!important}
.tab.td.act,.tab.diet.active{color:#1F6B4A!important;border-bottom-color:#1F6B4A!important}
.tab.tm.act,.tab.mon.active{color:#C0492F!important;border-bottom-color:#C0492F!important}
/* controls */
.ctrl,.ctrl-bar,.ctrl-bar.ctrl{background:#F3F1EA!important;border-bottom:1px solid #ECE8DE!important}
.si2,.si,.search-input{background:#fff!important;border:1px solid #DDD9CF!important;color:#22231F!important}
.si2:focus,.si:focus,.search-input:focus{border-color:#1F6B4A!important}
.cnt2,.cnt-badge,.badge{background:#fff!important;border:1px solid #ECE8DE!important;color:#5C5E55!important}
.cnt2 b,.cnt-badge b,.badge b,.badge span{color:#1F6B4A!important}
.clr2,.clr,.clear-btn{background:#fff!important;border:1px solid #ECE8DE!important;color:#5C5E55!important}
.clr2:hover,.clr:hover,.clear-btn:hover{border-color:#C0492F!important;color:#C0492F!important}
/* sidebar */
.sb,.filters{background:#FBFAF6!important;border-right:1px solid #ECE8DE!important}
.fg,.filter-group{border-bottom:1px solid #ECE8DE!important}
.fg-h,.fg-header{color:#5C5E55!important}
.fg-h:hover,.fg-header:hover{background:#F3F1EA!important}
.fg-b,.fg-body{background:#FBFAF6!important}
.fg-si,.fg-search{background:#fff!important;border:1px solid #ECE8DE!important;color:#22231F!important}
.sa,.sa2,.sel-all{color:#1F6B4A!important}
.cr,.cr2,.cb-row,.cb-row2{color:#5C5E55!important}
.cr:hover,.cr2:hover,.cb-row:hover{background:#F3F1EA!important;color:#22231F!important}
.cr.ck,.cr2.ck,.cb-row.checked{color:#22231F!important}
.cc,.cc2,.cb-count,.cb-cnt{background:#ECE8DE!important;color:#5C5E55!important}
/* sort bar */
.srt-bar,.sort-bar,.tb{background:#F3F1EA!important;border-bottom:1px solid #ECE8DE!important}
.srt-lbl,.sort-lbl,.tb-lbl{color:#5C5E55!important}
.srt-btn,.sort-btn,.sb-btn{background:#fff!important;border:1px solid #ECE8DE!important;color:#5C5E55!important}
.srt-btn:hover,.sort-btn:hover,.sb-btn:hover{color:#22231F!important;border-color:#1F6B4A!important}
.srt-btn.act,.sort-btn.active,.sb-btn.act{background:#E7F1EC!important;border-color:#1F6B4A!important;color:#1F6B4A!important}
/* tags */
.tag-row2,.tag-row,.active-tags{background:#F3F1EA!important;border-bottom:1px solid #ECE8DE!important}
.tag2,.tag{background:#E7F1EC!important;border:1px solid #1F6B4A!important;color:#1F6B4A!important}
.tag2:hover,.tag:hover{background:#F7E6E0!important;border-color:#B23838!important;color:#B23838!important}
.no-tag,.no-tags{color:#5C5E55!important}
/* dropdown filters */
.fd-btn{background:#fff!important;border:1px solid #ECE8DE!important;color:#5C5E55!important}
.fd-btn:hover,.fd-btn.op,.fd-btn.open{border-color:#1F6B4A!important;color:#22231F!important}
.fd-btn.hs,.fd-btn.has-sel{background:#E7F1EC!important;border-color:#1F6B4A!important;color:#1F6B4A!important}
.fd-menu{background:#fff!important;border:1px solid #DDD9CF!important;box-shadow:0 8px 24px #22231F1A!important}
.fd-si,.fd-search{background:#FBFAF6!important;border:1px solid #ECE8DE!important;color:#22231F!important}
/* table */
thead th{background:#F3F1EA!important;color:#5C5E55!important;border-bottom:2px solid #DDD9CF!important}
thead th:hover{color:#22231F!important}
thead th.srt,.thead th.sorted{color:#1F6B4A!important}
tbody tr{border-bottom:1px solid #F3F1EA!important}
tbody tr:hover{background:#FBFAF6!important}
tbody tr.exp-open,.tbody tr.expanded{background:#F3F1EA!important}
/* expand */
.exp-td,.expand-td{background:#FBFAF6!important;border-top:1px solid #ECE8DE!important}
.exp-item label,.expand-item label{color:#5C5E55!important}
.exp-item p,.expand-item p{color:#22231F!important}
/* pagination */
.pg-bar,.pg-bar2{background:#FBFAF6!important;border-top:1px solid #ECE8DE!important}
.pg-btn,.pg-btn2{background:#fff!important;border:1px solid #ECE8DE!important;color:#5C5E55!important}
.pg-btn:hover:not(:disabled),.pg-btn2:hover:not(:disabled){border-color:#1F6B4A!important;color:#1F6B4A!important}
.pg-btn.cur,.pg-btn2.cur{background:#E7F1EC!important;border-color:#1F6B4A!important;color:#1F6B4A!important;font-weight:700!important}
.pg-info,.pg-info2{color:#5C5E55!important}
.pg-info b,.pg-info2 b{color:#22231F!important}
/* pills */
.p.sf,.pill-safe{background:#E7F1EC!important;color:#1F6B4A!important;border-color:#A7E8BF!important}
.p.mn,.pill-monitor{background:#FAEFDD!important;color:#B86208!important;border-color:#B86208!important}
.p.av,.pill-avoid{background:#F7E6E0!important;color:#B23838!important;border-color:#B23838!important}
.p.mdf{background:#E7F1EC!important;color:#1F6B4A!important;border-color:#1F6B4A!important}
.p.bg,.pill-beg{background:#E7F1EC!important;color:#1F6B4A!important;border-color:#1F6B4A!important}
.p.it,.pill-int{background:#FAEFDD!important;color:#B86208!important;border-color:#B86208!important}
.p.ad,.pill-adv{background:#F7E6E0!important;color:#B23838!important;border-color:#B23838!important}
.p.tp,.pill-type{background:#E7F1EC!important;color:#1F6B4A!important;border-color:#1F6B4A!important}
/* day pills */
.dp.m-d,.day-pill.mon-d,.day-pill.mon-day{background:#E7F1EC!important;color:#1F6B4A!important;border-color:#E7F1EC!important}
.dp.t-d,.day-pill.tue-d,.day-pill.tue-day{background:#E7F1EC!important;color:#22231F!important;border-color:#E7F1EC!important}
.dp.w-d,.day-pill.wed-d,.day-pill.wed-day{background:#E7F1EC!important;color:#1F6B4A!important;border-color:#E7F1EC!important}
.dp.r-d,.day-pill.thu-d,.day-pill.thu-day{background:#FAEFDD!important;color:#B86208!important;border-color:#FAEFDD!important}
.dp.f-d,.day-pill.fri-d,.day-pill.fri-day{background:#E7F1EC!important;color:#1F6B4A!important;border-color:#A7E8BF!important}
.dp.s-d,.day-pill.sat-d,.day-pill.sat-day{background:#F3F1EA!important;color:#5C5E55!important;border-color:#22231F!important}
.dp.su-d,.day-pill.sun-d,.day-pill.sun-day{background:#FBFAF6!important;color:#5C5E55!important;border-color:#22231F!important}
/* phase pills */
.p.ph1c{background:#E7F1EC!important;color:#1F6B4A!important;border-color:#E7F1EC!important}
.p.ph2c{background:#FAEFDD!important;color:#C2700C!important;border-color:#FAEFDD!important}
.p.ph3c{background:#E7F1EC!important;color:#1F6B4A!important;border-color:#E7F1EC!important}
/* youtube */
.yt,.yta,.yt-link,.yt-a{background:#F7E6E0!important;border:1px solid #F2C9C9!important;color:#C0492F!important}
.yt:hover,.yta:hover,.yt-link:hover,.yt-a:hover{background:#FBE3E3!important}
/* diet */
.diet-wrap,.diet-section{background:#fff}
.mac-row,.macro-bar-wrap,.macro-row{background:#FBFAF6!important;border:1px solid #ECE8DE!important}
.meal-c,.meal-card,.diet-card{background:#fff!important;border:1px solid #ECE8DE!important}
.meal-c:hover,.meal-card:hover,.diet-card:hover{border-color:#5C5E55!important}
.m-exp,.meal-expand,.diet-expand{background:#FBFAF6!important;border-top:1px solid #ECE8DE!important;color:#5C5E55!important}
/* monitoring */
.mon-wrap,.mon-section{background:#fff}
.mon-cat-hdr{background:#FBFAF6!important;border-left:3px solid #C0492F!important;color:#22231F!important}
.mon-row,.mon-row{background:#fff}
.mon-row:hover{background:#FBFAF6!important}
.mon-tr,.mon-trig{color:#22231F!important}
.mon-ac,.mon-act{color:#5C5E55!important}
/* macros */
.mk{background:#F3F1EA!important;color:#22231F!important;border-color:#22231F!important}

// ── Pill helpers ───────────────────────────────────────────────────────────
function safetyPill(v){
  const m={SAFE:'pill-safe',MONITOR:'pill-monitor',AVOID:'pill-avoid'};
  const i={SAFE:'✓',MONITOR:'⚠',AVOID:'✗'};
  return `<span class="pill ${m[v]||''}">${i[v]||''} ${v}</span>`;
}
function diffPill(v){
  const m={Beginner:'pill-beg',Intermediate:'pill-int',Advanced:'pill-adv'};
  return `<span class="pill ${m[v]||''}">${v}</span>`;
}
function typePill(v){return `<span class="pill pill-type">${v}</span>`;}

// ── Build filter panel ─────────────────────────────────────────────────────
function buildFilters(){
  const panel = document.getElementById('filterPanel');
  panel.innerHTML = '';
  FILTER_CONFIG.forEach(fc => {
    const vals = FILTERS_META[fc.key] || [];
    if(!vals.length) return;
    const div = document.createElement('div');
    div.className = 'filter-group';
    const isOpen = ['exercise_type','difficulty','safety'].includes(fc.key);
    div.innerHTML = `
      <div class="fg-header ${isOpen?'open':''}" onclick="toggleFG(this)" style="--acc:${fc.color}">
        <span style="color:${fc.color}">${fc.label}</span>
        <span class="arrow">▼</span>
      </div>
      <div class="fg-body ${isOpen?'open':''}">
        <span class="sel-all" onclick="selAll('${fc.key}',this)">Select all</span>
        ${vals.length>8?`<input class="fg-search" placeholder="Filter ${fc.label.toLowerCase()}…" oninput="filterFG(this,'${fc.key}')">`:''}
        <div id="fg_${fc.key}">
        ${vals.map(v=>`
          <label class="cb-row" data-val="${v}">
            <input type="checkbox" value="${v}" data-field="${fc.key}" onchange="onCheck(this)">
            <span class="cb-label">${v||'(none)'}</span>
            <span class="cb-count" id="cnt_${fc.key}_${v.replace(/[^a-z0-9]/gi,'_')}">&nbsp;</span>
          </label>`).join('')}
        </div>
      </div>`;
    panel.appendChild(div);
  });
}

function toggleFG(el){
  el.classList.toggle('open');
  el.nextElementSibling.classList.toggle('open');
}
function filterFG(inp, field){
  const q = inp.value.toLowerCase();
  document.querySelectorAll(`#fg_${field} .cb-row`).forEach(row=>{
    row.style.display = row.dataset.val.toLowerCase().includes(q)?'flex':'none';
  });
}
function onCheck(cb){
  const field = cb.dataset.field;
  if(!state.filters[field]) state.filters[field] = new Set();
  cb.checked ? state.filters[field].add(cb.value) : state.filters[field].delete(cb.value);
  if(!state.filters[field].size) delete state.filters[field];
  cb.closest('label').classList.toggle('checked', cb.checked);
  applyFilters();
}
function selAll(field, el){
  const cbs = document.querySelectorAll(`input[data-field="${field}"]`);
  const allChecked = [...cbs].every(c=>c.checked);
  cbs.forEach(cb=>{
    cb.checked = !allChecked;
    cb.closest('label').classList.toggle('checked',!allChecked);
  });
  if(allChecked) delete state.filters[field];
  else state.filters[field] = new Set([...cbs].map(c=>c.value));
  el.textContent = allChecked?'Select all':'Clear all';
  applyFilters();
}

// ── Sort buttons ───────────────────────────────────────────────────────────
function buildSortBtns(){
  const wrap = document.getElementById('sortBtns');
  wrap.style.display='flex'; wrap.style.gap='4px'; wrap.style.flexWrap='wrap';
  SORT_COLS.forEach(sc=>{
    const b=document.createElement('button');
    b.className='sort-btn'+(state.sortField===sc.key?' active':'');
    b.textContent=sc.label;
    b.onclick=()=>{
      if(state.sortField===sc.key) state.sortDir*=-1;
      else {state.sortField=sc.key; state.sortDir=1;}
      document.querySelectorAll('.sort-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      applyFilters();
    };
    wrap.appendChild(b);
  });
}

// ── Table header ───────────────────────────────────────────────────────────
function buildThead(){
  const tr = document.createElement('tr');
  TABLE_COLS.forEach(col=>{
    const th=document.createElement('th');
    th.textContent=col.label;
    if(col.w) th.style.minWidth=col.w+'px';
    th.innerHTML=`${col.label} <span class="sort-icon">${state.sortField===col.key?(state.sortDir>0?'▲':'▼'):'⇅'}</span>`;
    if(state.sortField===col.key) th.classList.add('sorted');
    th.onclick=()=>{
      if(state.sortField===col.key) state.sortDir*=-1;
      else {state.sortField=col.key; state.sortDir=1;}
      applyFilters();
    };
    tr.appendChild(th);
  });
  const thead=document.getElementById('thead');
  thead.innerHTML=''; thead.appendChild(tr);
}

// ── Filter & render ────────────────────────────────────────────────────────
function applyFilters(){
  state.search = document.getElementById('searchInput').value.toLowerCase();

  let data = DB.filter(r=>{
    // Search
    if(state.search){
      const hay = [r.base_exercise,r.variation,r.active_primary,r.active_secondary,
                   r.clinical_notes,r.condition_use_case,r.equipment,r.muscle_group]
        .join(' ').toLowerCase();
      if(!hay.includes(state.search)) return false;
    }
    // Filters
    for(const [field, vals] of Object.entries(state.filters)){
      if(vals.size===0) continue;
      if(!vals.has(r[field]||'')) return false;
    }
    return true;
  });

  // Sort
  const sf = state.sortField;
  data.sort((a,b)=>{
    const av=a[sf]||'', bv=b[sf]||'';
    if(sf==='progression_order'||sf==='ex_id') return (parseFloat(av)-parseFloat(bv))*state.sortDir;
    return av.localeCompare(bv)*state.sortDir;
  });

  document.getElementById('cnt').textContent = data.length;
  renderTable(data);
  renderTags();
  updateCounts(data);
  buildThead();
}

function renderTable(data){
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('emptyState');
  const table = document.getElementById('mainTable');

  tbody.innerHTML = '';
  if(!data.length){empty.style.display='flex';table.style.display='none';return;}
  empty.style.display='none'; table.style.display='';

  data.forEach((r,i)=>{
    const id = r.ex_id+'_'+i;
    const tr = document.createElement('tr');
    tr.onclick=()=>toggleExpand(id,r,tr);

    TABLE_COLS.forEach(col=>{
      const td=document.createElement('td');
      const v=r[col.key]||'';
      if(col.key==='safety') td.innerHTML=safetyPill(v);
      else if(col.key==='difficulty') td.innerHTML=diffPill(v);
      else if(col.key==='exercise_type') td.innerHTML=typePill(v);
      else if(col.key==='youtube_search')
        td.innerHTML=`<a class="yt-link" href="https://www.youtube.com/results?search_query=${encodeURIComponent(r.variation+' exercise tutorial')}" target="_blank" onclick="e=>e.stopPropagation()">▶</a>`;
      else if(col.key==='base_exercise') {td.innerHTML=`<strong style="color:#22231F">${v}</strong>`;td.className='bold';}
      else if(col.key==='variation') {td.innerHTML=`<span style="color:#5C5E55">${v}</span>`;}
      else {td.textContent=v; td.style.color='#5C5E55';}
      td.title=v;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);

    // Expand row (hidden)
    const expTr=document.createElement('tr');
    expTr.id='exp_'+id;
    expTr.className='expand-row';
    expTr.style.display='none';
    const expTd=document.createElement('td');
    expTd.colSpan=TABLE_COLS.length;
    expTd.innerHTML=`<div class="expand-grid">
      ${[
        ['Primary Muscles',r.active_primary],
        ['Secondary Muscles',r.active_secondary],
        ['Stretch Target',r.stretch_mobility_target],
        ['Condition / Use Case',r.condition_use_case],
        ['Clinical Notes',r.clinical_notes],
        ['Safety Notes',r.safety_notes],
        ['Phase',r.phase],
        ['Progression Group',r.progression_group_id],
        ['Equipment',r.equipment],
        ['Exercise Purpose',r.exercise_purpose],
      ].filter(([,v])=>v).map(([l,v])=>`
        <div class="expand-item">
          <label>${l}</label>
          <p>${v}</p>
        </div>`).join('')}
      <div class="expand-item">
        <label>YouTube Search</label>
        <p><a class="yt-link" href="https://www.youtube.com/results?search_query=${encodeURIComponent(r.variation+' exercise tutorial')}" target="_blank">▶ Watch Tutorial</a></p>
      </div>
    </div>`;
    expTr.appendChild(expTd);
    tbody.appendChild(expTr);
  });
}

function toggleExpand(id,r,tr){
  const expTr=document.getElementById('exp_'+id);
  const isOpen=expTr.style.display!=='none';
  expTr.style.display=isOpen?'none':'table-row';
  tr.classList.toggle('expanded',!isOpen);
}

function renderTags(){
  const wrap=document.getElementById('activeTags');
  wrap.innerHTML='';
  Object.entries(state.filters).forEach(([field,vals])=>{
    vals.forEach(v=>{
      const fc=FILTER_CONFIG.find(x=>x.key===field);
      const tag=document.createElement('span');
      tag.className='tag';
      tag.innerHTML=`<span style="color:${fc?.color||'#8A8C82'};font-size:9px">${fc?.label||field}</span> ${v} ✕`;
      tag.onclick=()=>{
        vals.delete(v);
        if(!vals.size) delete state.filters[field];
        const cb=document.querySelector(`input[data-field="${field}"][value="${v}"]`);
        if(cb){cb.checked=false;cb.closest('label').classList.remove('checked');}
        applyFilters();
      };
      wrap.appendChild(tag);
    });
  });
}

function updateCounts(data){
  // Update per-option counts
  const counts={};
  FILTER_CONFIG.forEach(fc=>{
    counts[fc.key]={};
    data.forEach(r=>{
      const v=r[fc.key]||'';
      counts[fc.key][v]=(counts[fc.key][v]||0)+1;
    });
  });
  FILTER_CONFIG.forEach(fc=>{
    const vals=FILTERS_META[fc.key]||[];
    vals.forEach(v=>{
      const id='cnt_'+fc.key+'_'+v.replace(/[^a-z0-9]/gi,'_');
      const el=document.getElementById(id);
      if(el) el.textContent=counts[fc.key][v]||0;
    });
  });
}

function clearAll(){
  state.search=''; state.filters={};
  document.getElementById('searchInput').value='';
  document.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.checked=false; cb.closest('label')?.classList.remove('checked');
  });
  applyFilters();
}

function makePill(label, cls, onclick, isActive, color){
  const p = document.createElement('button');
  p.className = 'qf-pill '+cls+(isActive?' active':'');
  p.textContent = label;
  if(isActive && color) p.style.background = color;
  p.onclick = onclick;
  return p;
}

function setQf(field, value){
  QF[field] = value;
  // Sync into state.filters
  if(value){
    state.filters[field] = new Set([value]);
  } else {
    delete state.filters[field];
  }
  // Also uncheck sidebar checkboxes for this field and recheck if needed
  document.querySelectorAll(`input[data-field="${field}"]`).forEach(cb=>{
    cb.checked = value && cb.value===value;
    cb.closest('label')?.classList.toggle('checked', cb.checked);
  });
  refreshQfPills();
  applyFilters();
}

function refreshQfPills(){
  const catWrap = document.getElementById('qfCatPills');
  const diffWrap = document.getElementById('qfDiffPills');
  const muscleWrap = document.getElementById('qfMusclePills');
  const safetyWrap = document.getElementById('qfSafetyPills');
  [catWrap,diffWrap,muscleWrap,safetyWrap].forEach(w=>{if(w)w.innerHTML='';});
  buildQfPills();
}

function toggleQfExtra(){
  const rows = document.querySelectorAll('.qf-extra');
  const btn = document.getElementById('qfToggleBtn');
  const isOpen = rows[0].classList.contains('open');
  rows.forEach(r=>r.classList.toggle('open',!isOpen));
  btn.textContent = isOpen ? '+ More Filters' : '− Less Filters';
  // Adjust layout height
  const layout = document.querySelector('.layout');
  layout.style.height = isOpen ? 'calc(100vh - 210px)' : 'calc(100vh - 316px)';
}

// Patch clearAll to also reset QF
const _origClearAll = clearAll;

// ── Init ───────────────────────────────────────────────────────────────────
buildFilters();
buildSortBtns();
buildQfPills();
document.getElementById('total').textContent=DB.length;

/* mobile filter drawer toggle */
function toggleFilters(open){
  var p=document.getElementById('filterPanel'), o=document.getElementById('filtOverlay');
  var show=(open===undefined)?!p.classList.contains('open'):open;
  p.classList.toggle('open',show);
  o.classList.toggle('open',show);
}
window.toggleFilters=toggleFilters;

/* deep-link from the Punah hub: ?muscle=Chest,Core (whole-token match) */
(function(){
  try{
    var raw=new URLSearchParams(location.search).get('muscle');
    if(!raw) return;
    var wanted=raw.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
    if(!wanted.length) return;
    var matches=(FILTERS_META.muscle_group||[]).filter(function(v){
      var parts=v.toLowerCase().split(/[\/&]/).map(x=>x.trim());
      return wanted.some(function(w){ return parts.indexOf(w)>-1; });
    });
    if(!matches.length) return;
    state.filters['muscle_group']=new Set(matches);
    matches.forEach(function(v){
      var cb=document.querySelector('input[data-field="muscle_group"][value="'+v+'"]');
      if(cb){ cb.checked=true; var lab=cb.closest('label'); if(lab) lab.classList.add('checked'); }
    });
    var body=document.getElementById('fg_muscle_group');
    if(body){ var fb=body.closest('.fg-body'); if(fb){ fb.classList.add('open'); var h=fb.previousElementSibling; if(h) h.classList.add('open'); } }
  }catch(e){}
})();

applyFilters();

// Patch clearAll to reset quick filter state
const origClearAll = window.clearAll;
window.clearAll = function(){
  QF.category=''; QF.difficulty=''; QF.muscle_group=''; QF.safety='';
  refreshQfPills();
  state.search=''; state.filters={};
  document.getElementById('searchInput').value='';
  document.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.checked=false; cb.closest('label')?.classList.remove('checked');
  });
  applyFilters();
};
</script>
